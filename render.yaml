services:
  - type: web
    name: ai-quiz-generator-backend
    env: python
    plan: free
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd backend
      alembic upgrade head
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-database
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Set this to your deployed frontend's exact origin(s), comma-separated,
        # e.g. https://your-app.vercel.app
        sync: false
      - key: ENVIRONMENT
        value: production
databases:
  - name: quiz-database
    plan: free
